<ion-content [fullscreen]="true" style="--background: #ffffff;">
  
  <div class="min-h-full bg-white flex flex-col font-sans text-gray-900">
    
    <div class="px-6 pt-14 pb-4">
      <button (click)="regresar()" class="h-10 w-10 flex items-center justify-center rounded-full active:scale-90 transition-all bg-gray-50 border border-gray-100 shadow-sm">
        <ion-icon [icon]="iconArrowBack" class="text-xl text-gray-900"></ion-icon>
      </button>
    </div>

    <div class="flex-1 px-8 pt-2 pb-40 animate-fade-in-up">
      
      <div class="mb-10">
        <h1 class="text-4xl font-bold text-gray-900 tracking-tight leading-tight">
          Comienza tu<br>viaje hoy
        </h1>
        <p class="text-gray-500 text-sm mt-3 font-medium">Crea tu cuenta segura en BLAZE</p>
      </div>

      <div class="space-y-4">
        
        <div class="bg-white border border-gray-200 rounded-3xl p-5 shadow-sm flex items-center gap-4 group focus-within:border-black transition-all focus-within:bg-[#f9fafb]">
          <ion-icon [icon]="iconPerson" class="text-gray-400 group-focus-within:text-gray-900 transition-colors text-xl shrink-0"></ion-icon>
          <input [(ngModel)]="usuario.nombre" type="text" 
                 class="bg-transparent w-full text-gray-900 font-bold text-sm outline-none placeholder-gray-400"
                 placeholder="Nombre Completo">
        </div>

        <div class="bg-white border border-gray-200 rounded-3xl p-5 shadow-sm flex items-center gap-4 group focus-within:border-black transition-all focus-within:bg-[#f9fafb]">
          <ion-icon [icon]="iconMail" class="text-gray-400 group-focus-within:text-gray-900 transition-colors text-xl shrink-0"></ion-icon>
          <input [(ngModel)]="usuario.email" type="email" 
                 class="bg-transparent w-full text-gray-900 font-bold text-sm outline-none placeholder-gray-400"
                 placeholder="Correo electrónico">
        </div>

        <div class="bg-white border border-gray-200 rounded-3xl p-5 shadow-sm flex items-center gap-4 group focus-within:border-black transition-all focus-within:bg-[#f9fafb] relative mt-2">
          <ion-icon [icon]="iconLock" class="text-gray-400 group-focus-within:text-gray-900 transition-colors text-xl shrink-0"></ion-icon>
          <input [(ngModel)]="usuario.password" [type]="mostrarPassword ? 'text' : 'password'"
                 class="bg-transparent w-full text-gray-900 font-bold text-sm outline-none placeholder-gray-400 pr-10"
                 placeholder="Crea una contraseña (mínimo 6)">
          
          <div class="absolute inset-y-0 right-0 flex items-center pr-5 cursor-pointer z-10" (click)="mostrarPassword = !mostrarPassword">
            <ion-icon [icon]="mostrarPassword ? iconEyeOff : iconEye" class="text-gray-400 hover:text-gray-900 transition-colors text-xl"></ion-icon>
          </div>
        </div>

        <div class="bg-white border border-gray-200 rounded-3xl p-5 shadow-sm flex items-center gap-4 group focus-within:border-black transition-all focus-within:bg-[#f9fafb] relative">
          <ion-icon [icon]="iconLock" class="text-gray-400 group-focus-within:text-gray-900 transition-colors text-xl shrink-0"></ion-icon>
          <input [(ngModel)]="usuario.repetirPassword" [type]="mostrarPassword2 ? 'text' : 'password'"
                 class="bg-transparent w-full text-gray-900 font-bold text-sm outline-none placeholder-gray-400 pr-10"
                 placeholder="Repite tu contraseña">
          
          <div class="absolute inset-y-0 right-0 flex items-center pr-5 cursor-pointer z-10" (click)="mostrarPassword2 = !mostrarPassword2">
            <ion-icon [icon]="mostrarPassword2 ? iconEyeOff : iconEye" class="text-gray-400 hover:text-gray-900 transition-colors text-xl"></ion-icon>
          </div>
        </div>

      </div>
    </div>

    <div class="fixed bottom-0 left-0 w-full bg-white p-6 pb-8 border-t border-gray-50 flex flex-col items-center gap-6 shadow-[0_-10px_40px_rgba(0,0,0,0.03)] z-30">
        
        <button (click)="registrar()" [disabled]="cargando"
                class="flex w-full justify-center items-center gap-2 rounded-full bg-gray-900 text-white font-bold py-5 text-sm active:scale-[0.98] transition-all disabled:opacity-30 shadow-md">
          
          <ng-container *ngIf="!cargando">
            Continuar <ion-icon [icon]="iconArrowForward" class="text-lg"></ion-icon>
          </ng-container>

          <ion-spinner *ngIf="cargando" name="crescent" color="light"></ion-spinner>
        </button>

        <p class="text-center text-xs text-gray-500 font-medium">
          ¿Ya tienes cuenta?
          <a routerLink="/login" class="font-bold text-gray-900 hover:underline cursor-pointer ml-1">
            Inicia sesión
          </a>
        </p>
    </div>

  </div>

  <!-- 🚨 MODAL DE CONFIRMACIÓN DE ENVÍO -->
  <ion-modal [isOpen]="mostrarModalVerificacion" backdropDismiss="false" class="custom-alert-modal">
    <ng-template>
      <div class="flex items-center justify-center h-full px-4">
        <div class="bg-white rounded-[2rem] p-8 w-full max-w-sm shadow-2xl text-center border border-gray-100">
          
          <div class="h-20 w-20 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-6 border border-blue-100 shadow-inner">
            <ion-icon [icon]="iconMail" class="text-blue-500 text-4xl"></ion-icon>
          </div>
          
          <h3 class="text-2xl font-black text-gray-900 mb-2 tracking-tight">Verifica tu correo</h3>
          <p class="text-gray-500 text-sm font-medium mb-8 leading-relaxed">
            Te hemos enviado un enlace de confirmación a <strong class="text-gray-900">{{ usuario.email }}</strong>. Haz clic en el enlace de tu correo para activar tu cuenta antes de iniciar sesión.
          </p>
          
          <button (click)="irAlLogin()"
                  class="w-full bg-black text-white font-bold py-4 rounded-xl text-sm shadow-md hover:bg-gray-800 transition-colors active:scale-95">
            Ir a Iniciar Sesión
          </button>

        </div>
      </div>
    </ng-template>
  </ion-modal>

</ion-content>

<style>
  ion-modal.custom-alert-modal {
    --width: 90%;
    --max-width: 400px;
    --height: auto;
    --border-radius: 2rem;
    --box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    --background: transparent;
  }
  ion-modal.custom-alert-modal::part(content) {
    background: transparent;
    box-shadow: none;
  }
</style>
